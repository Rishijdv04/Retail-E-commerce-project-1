services:
  - type: web
    name: swiftcart-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://*.vercel.app
      - key: GOOGLE_CLIENT_ID
        value: 786009000625-aqcfi4f90apsf5qf9tisudt8o4fiqf3d.apps.googleusercontent.com
